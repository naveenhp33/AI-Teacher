# render.yaml
# Deployment configuration for Render.com (Backend)

services:
  - type: web
    name: mern-ai-server
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # Set this manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: CLIENT_URL
        sync: false  # Your Vercel frontend URL
